[workspace]
members = ["crates/app", "crates/edit-core", "crates/edit-catalog", "crates/edit-ingest", "crates/edit-metadata", "crates/edit-render"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
# storytold/lightcraft @ f2f449611d248a907f755d6e18f3701db5755f03 (2026-10-07,
# see docs/research/retouch-r0-memo.md). Not on crates.io, so git-pinned.
# Pinned here so every service can wrap its own upstream crates inside one
# bridge module; consumers live in their own service crate, the app never
# links the LightCraft tree directly. A revision bump is one small PR.
lightcraft-develop = { git = "https://github.com/storytold/lightcraft", rev = "f2f449611d248a907f755d6e18f3701db5755f03" }
lightcraft-raw = { git = "https://github.com/storytold/lightcraft", rev = "f2f449611d248a907f755d6e18f3701db5755f03" }
lightcraft-pipeline = { git = "https://github.com/storytold/lightcraft", rev = "f2f449611d248a907f755d6e18f3701db5755f03" }
lightcraft-codecs = { git = "https://github.com/storytold/lightcraft", rev = "f2f449611d248a907f755d6e18f3701db5755f03", default-features = false }
lightcraft-raster = { git = "https://github.com/storytold/lightcraft", rev = "f2f449611d248a907f755d6e18f3701db5755f03" }
lightcraft-color = { git = "https://github.com/storytold/lightcraft", rev = "f2f449611d248a907f755d6e18f3701db5755f03" }
lightcraft-geom = { git = "https://github.com/storytold/lightcraft", rev = "f2f449611d248a907f755d6e18f3701db5755f03" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
rusqlite = { version = "0.32", features = ["bundled"] }
flume = { version = "0.11" }
blake3 = { version = "1" }
sysinfo = { version = "0.36" }
edit-core = { path = "crates/edit-core" }
edit-catalog = { path = "crates/edit-catalog" }
edit-ingest = { path = "crates/edit-ingest" }
# Linux-only hotplug/labels via libudev (Windows/macOS volume code comes in
# a later cross-platform milestone).
udev = { version = "0.9" }
edit-metadata = { path = "crates/edit-metadata" }
edit-render = { path = "crates/edit-render" }
kamadak-exif = { version = "0.6" }
quick-xml = { version = "0.41" }
# Pure-Rust ICC transform for app-side paths that carry profiles (already in
# image's tree, so no new lock entry).
moxcms = { version = "0.8", default-features = false, features = [
    "avx_shaper_paths",
    "avx_luts",
    "sse_shaper_paths",
    "sse_luts",
    "neon_shaper_paths",
    "neon_luts",
] }
# The x11 and wayland features select gpui's Linux windowing backends;
# font-kit enables the freetype/fontconfig text stack, runtime_shaders compiles
# Metal shaders at runtime on macOS.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
# gpui-kit is the renamed longbridge/gpui-component repo. It wires gpui,
# gpui-base, gpui-component and default assets together, and pins gpui-pre
# 0.3.8 exactly (a crates.io snapshot of zed@279fe07).
gpui-kit = "=0.7.1"
